<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph Theory Nuggets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF1F4; --panel:#F8FAFB; --ink:#10233A; --muted:#66788A;
    --line:#C7D2DB; --accent:#1B6E8F;
    --head:'Bricolage Grotesque','Segoe UI',Arial,sans-serif;
    --body:'Source Serif 4',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.6}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

  .hero{max-width:1080px;margin:0 auto;padding:56px 24px 32px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(2.4rem,6vw,4.2rem);line-height:1.02;margin:0 0 16px;letter-spacing:-.02em}
  .lede{max-width:34em;color:#2C4159;margin:0 0 20px}
  .stats{display:flex;flex-wrap:wrap;gap:8px 24px;font-family:var(--head);font-weight:500;color:var(--muted)}
  #graph{width:100%;max-width:320px;justify-self:center}
  #graph line{stroke:var(--ink);stroke-width:1.6;opacity:.55}
  #graph circle{fill:var(--panel);stroke:var(--ink);stroke-width:2.2}
  #graph circle.on{fill:var(--accent);stroke:var(--accent)}

  main{max-width:1080px;margin:0 auto;padding:8px 24px 72px;display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
  section h2{font-family:var(--head);font-weight:700;font-size:1.6rem;margin:0 0 2px}
  section .sub{margin:0 0 16px;color:var(--muted);font-size:.95rem}
  ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .item{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
  .node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:700;font-size:.9rem}
  .name{font-family:var(--head);font-weight:600;font-size:1.05rem;line-height:1.25}
  .tag{display:block;font-family:var(--head);font-size:.8rem;font-weight:500}

  .ready{border-color:var(--ink)}
  .ready .node{background:var(--ink);color:#fff}
  .ready .tag{color:var(--accent)}
  a.item:hover{background:#fff;border-color:var(--accent)}
  a.item:hover .name{text-decoration:underline;text-underline-offset:3px}

  .soon{background:transparent;border-style:dashed}
  .soon .node{border:2px dashed var(--line);color:var(--muted)}
  .soon .name,.soon .tag{color:var(--muted)}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;padding-top:36px}
    #graph{max-width:220px;order:-1;justify-self:start}
    main{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="hero">
  <div>
    <h1>Graph Theory Nuggets</h1>
    <p class="lede">Lecture-style topics for the full story, and short interactive nuggets for one idea at a time.</p>
    <div class="stats"><span id="tcount"></span><span id="ncount"></span></div>
  </div>
  <svg id="graph" viewBox="0 0 300 300" role="img" aria-label="The Petersen graph. Vertices light up as items are published."></svg>
</header>

<main>
  <section aria-labelledby="th">
    <h2 id="th">Topics</h2>
    <p class="sub">Lecture notes</p>
    <ol id="topics"></ol>
  </section>
  <section aria-labelledby="nh">
    <h2 id="nh">Nuggets</h2>
    <p class="sub">Short interactive lessons</p>
    <ol id="nuggets"></ol>
  </section>
</main>

<script>
/* ------------------------------------------------------------------
   HOW TO ADD AN ITEM
   Each list has 25 entries. To publish one, edit its line below:
     - set  ready:true
     - replace the title (e.g. "Topic-3" -> "Trees")
   Files are expected in this same folder, named
     topic-01.html ... topic-25.html   and   nugget-01.html ... nugget-25.html
   (or add  file:"anything.html"  to an entry to use a different name).
   The link, the counters and the graph above update automatically.
------------------------------------------------------------------- */
const topics = [
  {<a href="Topics/CG.html"><span class="num">01</span><span class="title">Connected graphs</span><span class="arrow">→</span></a>,  ready:true  },
  { title:"Topics/Tree.html",  ready:true  },
  { title:"Topic-3",  ready:false },
  { title:"Topic-4",  ready:false },
  { title:"Topic-5",  ready:false },
  { title:"Topic-6",  ready:false },
  { title:"Topic-7",  ready:false },
  { title:"Topic-8",  ready:false },
  { title:"Topic-9",  ready:false },
  { title:"Topic-10", ready:false },
  { title:"Topic-11", ready:false },
  { title:"Topic-12", ready:false },
  { title:"Topic-13", ready:false },
  { title:"Topic-14", ready:false },
  { title:"Topic-15", ready:false },
  { title:"Topic-16", ready:false },
  { title:"Topic-17", ready:false },
  { title:"Topic-18", ready:false },
  { title:"Topic-19", ready:false },
  { title:"Topic-20", ready:false },
  { title:"Topic-21", ready:false },
  { title:"Topic-22", ready:false },
  { title:"Topic-23", ready:false },
  { title:"Topic-24", ready:false },
  { title:"Topic-25", ready:false }
];

const nuggets = [
  { title:"Nuggets/few.html",  ready:true  },
  { title:"Nuggets/Cayley.html",  ready:true  },
  { title:"Nugget-3",  ready:false },
  { title:"Nugget-4",  ready:false },
  { title:"Nugget-5",  ready:false },
  { title:"Nugget-6",  ready:false },
  { title:"Nugget-7",  ready:false },
  { title:"Nugget-8",  ready:false },
  { title:"Nugget-9",  ready:false },
  { title:"Nugget-10", ready:false },
  { title:"Nugget-11", ready:false },
  { title:"Nugget-12", ready:false },
  { title:"Nugget-13", ready:false },
  { title:"Nugget-14", ready:false },
  { title:"Nugget-15", ready:false },
  { title:"Nugget-16", ready:false },
  { title:"Nugget-17", ready:false },
  { title:"Nugget-18", ready:false },
  { title:"Nugget-19", ready:false },
  { title:"Nugget-20", ready:false },
  { title:"Nugget-21", ready:false },
  { title:"Nugget-22", ready:false },
  { title:"Nugget-23", ready:false },
  { title:"Nugget-24", ready:false },
  { title:"Nugget-25", ready:false }
];

const pad = n => String(n).padStart(2,'0');

function render(listId, items, prefix){
  const ol = document.getElementById(listId);
  items.forEach((it,i)=>{
    const num = i+1;
    const file = it.file || `${prefix}-${pad(num)}.html`;
    const li = document.createElement('li');
    const inner = `<span class="node">${num}</span>
      <span><span class="name">${it.title}</span>
      <span class="tag">${it.ready ? 'Open' : 'Coming soon'}</span></span>`;
    li.innerHTML = it.ready
      ? `<a class="item ready" href="${file}">${inner}</a>`
      : `<div class="item soon">${inner}</div>`;
    ol.appendChild(li);
  });
  return items.filter(x=>x.ready).length;
}

const tDone = render('topics', topics, 'topic');
const nDone = render('nuggets', nuggets, 'nugget');
document.getElementById('tcount').textContent = `Topics: ${tDone} of ${topics.length}`;
document.getElementById('ncount').textContent = `Nuggets: ${nDone} of ${nuggets.length}`;

/* Petersen graph: one vertex lights up per published item (up to 10) */
const svg = document.getElementById('graph');
const NS = 'http://www.w3.org/2000/svg';
const pts = [];
for(let k=0;k<5;k++){const a=-Math.PI/2+k*2*Math.PI/5;pts.push([150+125*Math.cos(a),150+125*Math.sin(a)]);}
for(let k=0;k<5;k++){const a=-Math.PI/2+k*2*Math.PI/5;pts.push([150+62*Math.cos(a),150+62*Math.sin(a)]);}
const edges = [];
for(let k=0;k<5;k++){edges.push([k,(k+1)%5]);edges.push([k,k+5]);edges.push([5+k,5+(k+2)%5]);}
edges.forEach(([a,b])=>{
  const l=document.createElementNS(NS,'line');
  l.setAttribute('x1',pts[a][0]);l.setAttribute('y1',pts[a][1]);
  l.setAttribute('x2',pts[b][0]);l.setAttribute('y2',pts[b][1]);
  svg.appendChild(l);
});
const lit = Math.min(tDone+nDone,10);
pts.forEach(([x,y],i)=>{
  const c=document.createElementNS(NS,'circle');
  c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',11);
  if(i<lit)c.setAttribute('class','on');
  svg.appendChild(c);
});
</script>
</body>
</html>
